blueprint:
  name: Heizen nach Anwesenheit
  description: >
    Senkt die Temperatur eines Raums ab, wenn der Präsenzmelder ihn eine
    Weile leer meldet, und heizt wieder auf, wenn jemand einige Minuten im
    Raum ist. Kurze Erkennungen (Durchgang, ein Gerät, das kurz auslöst)
    heizen nicht auf. Merkt sich in einem Schalter-Helfer, ob der Raum als
    belegt gilt; der Blueprint „Heizen nach Raumtemperatur regeln“ liest ihn.
    Aus dem How-to von Senvolon:
    https://senvolon.de/blogs/wissen/home-assistant-heizung-nach-anwesenheit
  domain: automation
  source_url: https://github.com/senvolon/home-assistant-blueprints/blob/main/automation/heizen_nach_anwesenheit.yaml
  input:
    praesenz:
      name: Präsenz des Raums
      description: Präsenz-Entität des Präsenzmelders (binary_sensor)
      selector:
        entity:
          domain: binary_sensor
    thermostat:
      name: Thermostat des Raums
      selector:
        entity:
          domain: climate
    komfort:
      name: Komforttemperatur (Zahlenwert-Helfer)
      selector:
        entity:
          domain: input_number
    absenk:
      name: Absenktemperatur (Zahlenwert-Helfer)
      selector:
        entity:
          domain: input_number
    hauptschalter:
      name: Hauptschalter (Schalter-Helfer)
      description: Ist er aus, tut die Automation nichts, etwa im Sommer.
      selector:
        entity:
          domain: input_boolean
    belegt:
      name: Raum belegt (Schalter-Helfer)
      description: Wird von dieser Automation gesetzt, nicht von Hand.
      selector:
        entity:
          domain: input_boolean
    leer_minuten:
      name: Wartezeit bis zur Absenkung
      default: 30
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    belegt_minuten:
      name: Wartezeit bis zum Aufheizen
      description: So lange muss jemand im Raum sein, bevor geheizt wird.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: min

mode: restart
variables:
  komfort_helfer: !input komfort
  absenk_helfer: !input absenk
triggers:
  - trigger: state
    entity_id: !input praesenz
    to: "off"
    for:
      minutes: !input leer_minuten
    id: leer
  - trigger: state
    entity_id: !input praesenz
    to: "on"
    for:
      minutes: !input belegt_minuten
    id: belegt
conditions:
  - condition: state
    entity_id: !input hauptschalter
    state: "on"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: leer
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input belegt
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: "{{ states(absenk_helfer) | float }}"
      - conditions:
          - condition: trigger
            id: belegt
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input belegt
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: "{{ states(komfort_helfer) | float }}"
